resolver: lts-24.48
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-quic
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - git: https://github.com/haskell-tls/hs-tls
    commit: b1f84fa8d7255494592245027762e8bc6330125f
    subdirs:
      - tls
      - tls-session-manager
  - ech-config-0.0.2
  - crypto-token-0.2.1
  - fast-logger-3.2.8
  - crypton-asn1-encoding-0.10.0
  - crypton-asn1-parse-0.10.0
  - crypton-asn1-types-0.4.1
  - crypton-2.2.7
  - crypton-x509-1.10.3
  - crypton-x509-store-1.10.1
  - crypton-x509-system-1.10.1
  - crypton-x509-validation-1.10.3
  - hpke-0.4.0
  # TEMPORARY: unreleased http2, quic, http3 and tls from git.
  # Revert to Hackage versions before merging.
  - http-semantics-0.5.0
  - network-byte-order-0.1.10
  - git: https://github.com/kazu-yamamoto/http2
    commit: c37c93eb976e2916054f5eb19711ac7be98edfbc
  - git: https://github.com/kazu-yamamoto/quic
    commit: 3509cf9a00c0a95ac03618241f63b743a0a66a50
  - git: https://github.com/kazu-yamamoto/http3
    commit: 4bee4857e1311585555111df24981c117a31fceb
  - mlkem-0.2.2.0
  - network-3.2.16.0
  - network-control-0.2.0
  - ram-0.22.0
  - sockaddr-0.0.1
  - time-hourglass-0.3.0
allow-newer: true
allow-newer-deps:
  - http2
  - http3
