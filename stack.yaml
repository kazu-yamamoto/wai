  # Revert to Hackage versions before merging.
  - git: https://github.com/kazu-yamamoto/http-semantics
    commit: ee8038f7b4603f633f271b26b58328ae9382caa3
  - git: https://github.com/kazu-yamamoto/http2
    commit: 760dae5bc803208079d36ff6fa4117d5c6dcd1e1
