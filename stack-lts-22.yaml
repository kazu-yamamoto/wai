resolver: lts-22.43
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
  zlib:
    bundled-c-zlib: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - crypton-1.0.4
  - crypto-token-0.1.2
  - crypton-x509-store-1.6.11
  - crypton-x509-validation-1.6.13
  - ech-config-0.0.1
  - hpke-0.0.0
  # TEMPORARY: unreleased http-semantics and http2 from git.
  # Revert to Hackage versions before merging.
  - git: https://github.com/kazu-yamamoto/http-semantics
    commit: ee8038f7b4603f633f271b26b58328ae9382caa3
  - git: https://github.com/kazu-yamamoto/http2
    commit: ff039bdb8e8d196579ef76be26d25710ab0ce1c0
  - network-3.2.14.0
  - network-control-0.2.0
  - random-1.3.1
  - tls-2.1.11
  - tls-session-manager-0.0.7
  - uuid-types-1.0.6
  - websockets-0.13.0.0
  - zlib-0.7.1.0
  - zlib-clib-1.3.1
allow-newer: true
allow-newer-deps:
  - http2
  - http3
