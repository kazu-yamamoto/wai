resolver: nightly
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-quic
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - git: https://github.com/haskell-tls/hs-tls
    commit: 4e0e6f9c69ca19cab3d1ec2e7bcc7a6d7fcd5d4c
    subdirs:
      - tls
      - tls-session-manager
  - hpke-0.4.0
  - ech-config-0.0.2
  - crypton-x509-validation-1.10.3
  - crypton-x509-system-1.10.1
  - crypton-x509-store-1.10.1
  - crypton-x509-1.10.3
  - network-3.2.16.0
  - network-control-0.2.0
  # TEMPORARY: unreleased http2, quic, http3 and tls from git.
  # Revert to Hackage versions before merging.
  - http-semantics-0.5.0
  - network-byte-order-0.1.10
  - git: https://github.com/kazu-yamamoto/http2
    commit: cd5e6fb31f22ec59eb382f962213af88b65f3fc0
  - git: https://github.com/kazu-yamamoto/quic
    commit: 9025fbdd2dbb7baad65482e62250895dde695bf3
  - git: https://github.com/kazu-yamamoto/http3
    commit: eb64c7d4a6e979c92265b9103809391760c39629
  - crypton-2.2.7
  - crypto-token-0.2.1
allow-newer: true
allow-newer-deps:
  - http2
  - http3
