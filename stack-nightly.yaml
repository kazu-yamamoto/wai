resolver: nightly
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-quic
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - tls-2.6.2
  - tls-session-manager-0.1.2@rev:1
  - hpke-0.4.0
  - ech-config-0.0.2
  - crypton-x509-validation-1.10.3
  - crypton-x509-system-1.10.1
  - crypton-x509-store-1.10.1
  - crypton-x509-1.10.3
  - network-3.2.14.0
  - network-control-0.2.0
  # TEMPORARY: unreleased http-semantics, http2, quic and http3 from git.
  # Revert to Hackage versions before merging.
  - git: https://github.com/kazu-yamamoto/http-semantics
    commit: ee8038f7b4603f633f271b26b58328ae9382caa3
  - git: https://github.com/kazu-yamamoto/http2
    commit: ff039bdb8e8d196579ef76be26d25710ab0ce1c0
  - git: https://github.com/kazu-yamamoto/quic
    commit: b54ace2221e906df633c0b32d02cbd36284b5748
  - git: https://github.com/kazu-yamamoto/http3
    commit: 908339eb84c13688df44f15b0b428f5aae39a7be
  - crypton-2.2.7
  - crypto-token-0.2.1
allow-newer: true
allow-newer-deps:
  - http2
  - http3
