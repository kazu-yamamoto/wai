resolver: nightly
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-quic
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - tls-2.6.4
  - tls-session-manager-0.1.2@rev:1
  - hpke-0.4.0
  - ech-config-0.0.2
  - crypton-x509-validation-1.10.3
  - crypton-x509-system-1.10.1
  - crypton-x509-store-1.10.1
  - crypton-x509-1.10.3
  - network-3.2.16.0
  - network-control-0.2.0
  # TEMPORARY: unreleased http-semantics, http2, quic and http3 from git.
  # Revert to Hackage versions before merging.
  - git: https://github.com/kazu-yamamoto/http-semantics
    commit: ee8038f7b4603f633f271b26b58328ae9382caa3
  - git: https://github.com/kazu-yamamoto/http2
    commit: 5deaba332750943d2c03df06addabe13259e87c3
  - git: https://github.com/kazu-yamamoto/quic
    commit: bea99beba74682b1612363886ee6fcde610dcff9
  - git: https://github.com/kazu-yamamoto/http3
    commit: 2f057c3795f37fe5ee04677c57d85e0efcc50361
  - crypton-2.2.7
  - crypto-token-0.2.1
allow-newer: true
allow-newer-deps:
  - http2
  - http3
