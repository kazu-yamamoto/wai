resolver: lts-23.28
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-quic
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - git: https://github.com/haskell-tls/hs-tls
    commit: 0539aab7167af11aa8dbc47976659f7385cdf929
    subdirs:
      - tls
      - tls-session-manager
  - crypto-token-0.2.1
  - crypton-asn1-encoding-0.10.0
  - crypton-asn1-parse-0.10.0
  - crypton-asn1-types-0.4.1
  - crypton-2.2.7
  - crypton-pem-0.3.0
  - crypton-x509-1.10.3
  - crypton-x509-store-1.10.1
  - crypton-x509-system-1.10.1
  - crypton-x509-validation-1.10.3
  - ech-config-0.0.2
  - fast-logger-3.2.8
  - hpke-0.4.0
  # TEMPORARY: unreleased http2, quic, http3 and tls from git.
  # Revert to Hackage versions before merging.
  - http-semantics-0.5.0
  - network-byte-order-0.1.10
  - git: https://github.com/kazu-yamamoto/http2
    commit: 35c5f5d423b75a2ee9f8f9b8a40f16c6e55a7433
  - git: https://github.com/kazu-yamamoto/quic
    commit: bc35678c545a1bb25b3b189f5f798d62c92fbcd7
  - git: https://github.com/kazu-yamamoto/http3
    commit: 66ec513f33f86f38df32bb8891941e32c4014d94
  - mlkem-0.2.2.0
  - network-3.2.16.0
  - network-control-0.2.0
  - ram-0.22.0
  - sockaddr-0.0.1
  - time-hourglass-0.3.0
allow-newer: true
allow-newer-deps:
  - http2
  - http3
