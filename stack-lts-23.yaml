resolver: lts-23.28
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-quic
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - git: https://github.com/haskell-tls/hs-tls
    commit: f7801eb9a1ef8af26e08773279e1fde2e7497938
    subdirs:
      - tls
      - tls-session-manager
  - crypto-token-0.2.1
  - crypton-asn1-encoding-0.10.0
  - crypton-asn1-parse-0.10.0
  - crypton-asn1-types-0.4.1
  - crypton-2.2.7
  - crypton-pem-0.3.0
  - crypton-x509-1.10.3
  - crypton-x509-store-1.10.1
  - crypton-x509-system-1.10.1
  - crypton-x509-validation-1.10.3
  - ech-config-0.0.2
  - fast-logger-3.2.8
  - hpke-0.4.0
  # TEMPORARY: unreleased http2, quic, http3 and tls from git.
  # Revert to Hackage versions before merging.
  - http-semantics-0.5.0
  - network-byte-order-0.1.10
  - git: https://github.com/kazu-yamamoto/http2
    commit: 35c5f5d423b75a2ee9f8f9b8a40f16c6e55a7433
  - git: https://github.com/kazu-yamamoto/quic
    commit: 398513a5d67f91167bba98ca51497e58e31d4c77
  - git: https://github.com/kazu-yamamoto/http3
    commit: 23b5113c6f5ab503abf89ddf277015d703502285
  - mlkem-0.2.2.0
  - network-3.2.16.0
  - network-control-0.2.0
  - ram-0.22.0
  - sockaddr-0.0.1
  - time-hourglass-0.3.0
allow-newer: true
allow-newer-deps:
  - http2
  - http3
